# Production Configuration for Render

# Application
spring.application.name=robot-control-system

# Server
server.port=${PORT:8080}

# Database - PostgreSQL on Render
# Render provides DATABASE_URL without jdbc: prefix, so we use the Internal Database URL
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Logging (production - less verbose)
logging.level.root=INFO
logging.level.com.example.robotcontrolsystembackend=INFO
logging.level.org.hibernate.SQL=WARN

# Actuator (optional - for health checks)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
